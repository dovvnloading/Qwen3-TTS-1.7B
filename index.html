<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qwen3-TTS Studio</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Set the theme before first paint, otherwise the window flashes the 
      default theme for a frame before React mounts. Must stay in sync with
      resolveInitialTheme() in useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('qwen-tts-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <!-- The UI is fully offline; system font fallback avoids remote requests. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
