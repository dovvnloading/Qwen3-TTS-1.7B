<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qwen3-TTS Studio</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Set the theme before first paint, otherwise the window flashes the 
      default theme for a frame before React mounts. Must stay in sync with
      resolveInitialTheme() in useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('qwen-tts-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <!--
      Fonts are the only remote asset, and they degrade gracefully to the
      system stack when offline. Tailwind is compiled into the bundle so the
      UI stays fully styled with no network access.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
